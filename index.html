<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Job Hub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#f3f6fb;color:#172033}
header{background:#123b72;color:white;padding:20px;text-align:center}
nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding:12px;background:white}
button{background:#1764c0;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd4df;border-radius:7px}
main{max-width:850px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.hidden{display:none}
h2{color:#123b72}
small{color:#65748b}
</style>
</head>
<body>
<header>
<h1>Apna Job Hub</h1>
<p>Find Jobs • Apply Free • Hire Candidates</p>
</header>

<nav>
<button onclick="show('home')">Home / Jobs</button>
<button onclick="show('login')">Login</button>
<button onclick="show('register')">Register</button>
<button onclick="logout()">Logout</button>
</nav>

<main>
<section id="home">
<h2>Latest Jobs</h2>
<input id="search" placeholder="Job या Location खोजें" oninput="filterJobs()">
<div id="jobs">Jobs लोड हो रही हैं...</div>
</section>

<section id="login" class="hidden card">
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login करें</button>
</section>

<section id="register" class="hidden card">
<h2>New Registration</h2>
<input id="regName" placeholder="पूरा नाम">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password">
<select id="regRole">
<option value="candidate">Candidate</option>
<option value="recruiter">Recruiter</option>
</select>
<button onclick="register()">Register करें</button>
</section>

<section id="recruiter" class="hidden card">
<h2>Recruiter Dashboard</h2>
<p>नई Job की जानकारी भरें</p>
<input id="jobTitle" placeholder="Job Title">
<input id="company" placeholder="Company Name">
<input id="location" placeholder="Location">
<input id="salary" placeholder="Salary">
<textarea id="description" placeholder="Job Details"></textarea>
<button onclick="postJob()">Job Submit करें</button>
</section>

<section id="account" class="hidden card">
<h2>My Account</h2>
<p id="userInfo"></p>
</section>
</main>

<script>
const SUPABASE_URL = "https://obfscofwdnypjabtgpyy.supabase.co";
const SUPABASE_KEY = "अपनी_SUPABASE_PUBLISHABLE_KEY_यहाँ_डालें";
const db = window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allJobs = [];
let currentUser = null;

function show(id){
document.querySelectorAll("main section").forEach(s=>s.classList.add("hidden"));
document.getElementById(id).classList.remove("hidden");
}

async function register(){
const name=document.getElementById("regName").value.trim();
const email=document.getElementById("regEmail").value.trim();
const password=document.getElementById("regPassword").value;
const role=document.getElementById("regRole").value;
if(!name||!email||!password){alert("सभी जानकारी भरें");return;}
const {data,error}=await db.auth.signUp({
email,password,
options:{data:{full_name:name,role:role}}
});
if(error){alert(error.message);return;}
alert("Registration request भेज दी गई। Email verification करें अगर मांगा जाए।");
}

async function login(){
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;
const {data,error}=await db.auth.signInWithPassword({email,password});
if(error){alert(error.message);return;}
currentUser=data.user;
await loadAccount();
}

async function logout(){
await db.auth.signOut();
currentUser=null;
show("home");
alert("Logout हो गया");
}

async function loadAccount(){
const {data:userData}=await db.auth.getUser();
currentUser=userData.user;
if(!currentUser)return;
const {data:profile}=await db.from("profiles")
.select("full_name,role").eq("id",currentUser.id).maybeSingle();
document.getElementById("userInfo").innerText=
"Email: "+currentUser.email+" | Role: "+(profile?.role||"candidate");
show("account");
if(profile?.role==="recruiter")show("recruiter");
}

async function loadJobs(){
const {data,error}=await db.from("jobs")
.select("*").eq("status","approved").order("created_at",{ascending:false});
if(error){
document.getElementById("jobs").innerText="Jobs लोड नहीं हुईं: "+error.message;
return;
}
allJobs=data||[];
renderJobs(allJobs);
}

function renderJobs(list){
const box=document.getElementById("jobs");
if(!list.length){box.innerHTML="<p>अभी कोई Job उपलब्ध नहीं है।</p>";return;}
box.innerHTML=list.map(j=>`
<div class="card">
<h3>${safe(j.title)}</h3>
<b>${safe(j.company||"Company")}</b>
<p>📍 ${safe(j.location||"")}</p>
<p>💰 ${safe(j.salary||"Salary जानकारी उपलब्ध नहीं")}</p>
<p>${safe(j.description||"")}</p>
<button onclick="applyJob('${j.id}')">Free Apply</button>
</div>`).join("");
}

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function filterJobs(){
const q=document.getElementById("search").value.toLowerCase();
renderJobs(allJobs.filter(j=>
[j.title,j.company,j.location].join(" ").toLowerCase().includes(q)
));
}

async function applyJob(jobId){
const {data}=await db.auth.getUser();
if(!data.user){alert("Apply करने के लिए पहले Login करें");show("login");return;}
const {error}=await db.from("applications").insert({
job_id:jobId,candidate_id:data.user.id
});
if(error){alert("Apply नहीं हुआ: "+error.message);return;}
alert("Application भेज दी गई!");
}

async function postJob(){
const {data}=await db.auth.getUser();
if(!data.user){alert("पहले Login करें");return;}
const title=document.getElementById("jobTitle").value.trim();
const company=document.getElementById("company").value.trim();
const location=document.getElementById("location").value.trim();
const salary=document.getElementById("salary").value.trim();
const description=document.getElementById("description").value.trim();
if(!title||!company||!location){alert("Job की जरूरी जानकारी भरें");return;}
const {error}=await db.from("jobs").insert({
recruiter_id:data.user.id,title,company,location,salary,description,status:"pending"
});
if(error){alert("Job submit नहीं हुई: "+error.message);return;}
alert("Job approval के लिए भेज दी गई।");
}

db.auth.onAuthStateChange((_event,session)=>{
currentUser=session?.user||null;
});
(async()=>{
const {data}=await db.auth.getSession();
if(data.session){await loadAccount();}
await loadJobs();
})();
</script>
</body>
</html>
