
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apna Job Hub</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#172033}
header{background:#123b72;color:white;padding:22px;text-align:center}
header h1{margin:0}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:13px;background:white;position:sticky;top:0}
button{background:#1764c0;color:white;border:0;padding:11px 16px;border-radius:7px;cursor:pointer;margin:4px}
button:hover{background:#104b91}
input,textarea,select{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd4df;border-radius:7px;font-size:15px}
main{max-width:850px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px;box-shadow:0 2px 8px #0001}
.hidden{display:none}
h2{color:#123b72}
.job-title{margin-bottom:8px}
.green{background:#159447}
.whatsapp{background:#159447}
.status{color:#d17b00;font-weight:bold}
footer{text-align:center;padding:20px;color:#65748b}
</style>
</head>

<body>

<header>
<h1>Apna Job Hub</h1>
<p>Find Jobs • Apply Free • Hire Candidates</p>
</header>

<nav>
<button onclick="show('home')">Home / Jobs</button>
<button onclick="show('login')">Login</button>
<button onclick="show('register')">Register</button>
<button onclick="dashboard()">Dashboard</button>
<button onclick="logout()">Logout</button>
</nav>

<main>

<section id="home">
<h2>Latest Jobs</h2>
<input id="search" placeholder="Job या Location खोजें" oninput="filterJobs()">
<div id="jobs">Jobs लोड हो रही हैं...</div>
</section>

<section id="login" class="hidden card">
<h2>Login</h2>
<input id="loginEmail" type="email" placeholder="Email">
<input id="loginPassword" type="password" placeholder="Password">
<button onclick="login()">Login करें</button>
</section>

<section id="register" class="hidden card">
<h2>New Registration</h2>
<input id="regName" placeholder="पूरा नाम">
<input id="regEmail" type="email" placeholder="Email">
<input id="regPassword" type="password" placeholder="Password (कम से कम 6 अक्षर)">
<select id="regRole">
<option value="candidate">Candidate</option>
<option value="recruiter">Recruiter</option>
</select>
<button onclick="register()">Register करें</button>
</section>

<section id="account" class="hidden card">
<h2>My Account</h2>
<p id="userInfo"></p>
</section>

<section id="recruiter" class="hidden card">
<h2>Recruiter Dashboard</h2>
<p>नई Job की जानकारी भरें</p>

<input id="jobTitle" placeholder="Job Title">
<input id="company" placeholder="Company Name">
<input id="location" placeholder="Location">
<input id="salary" placeholder="Salary">
<textarea id="description" placeholder="Job Details"></textarea>

<button onclick="postJob()">Job Submit करें</button>
<h3>आपकी पोस्ट की गई Jobs</h3>
<div id="myJobs"></div>
</section>

</main>

<footer>
Apna Job Hub © 2026 | Free Job Portal
</footer>

<script>
const SUPABASE_URL = "https://obfscofwdnypjabtgpyy.supabase.co";
const SUPABASE_KEY = "sb_publishable_NTjzI2NEwJZjPaZDuuU_fQ_TWWtxxm-";

const db = window.supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let allJobs = [];
let currentUser = null;
let currentRole = null;

function show(id){
document.querySelectorAll("main section").forEach(s=>{
s.classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");
}

function dashboard(){
if(!currentUser){
alert("पहले Login करें");
show("login");
return;
}
show("account");
if(currentRole === "recruiter"){
show("recruiter");
}
}

async function register(){
const name=document.getElementById("regName").value.trim();
const email=document.getElementById("regEmail").value.trim();
const password=document.getElementById("regPassword").value;
const role=document.getElementById("regRole").value;

if(!name || !email || !password){
alert("सभी जानकारी भरें");
return;
}

if(password.length < 6){
alert("Password कम से कम 6 अक्षर का होना चाहिए");
return;
}

const {data,error}=await db.auth.signUp({
email:email,
password:password,
options:{
data:{
full_name:name,
role:role
}
}
});

if(error){
alert(error.message);
return;
}

if(data.session){
currentUser=data.user;
await loadAccount();
}else{
alert("Registration सफल! अब Email Verification करें और फिर Login करें।");
show("login");
}
}

async function login(){
const email=document.getElementById("loginEmail").value.trim();
const password=document.getElementById("loginPassword").value;

if(!email || !password){
alert("Email और Password भरें");
return;
}

const {data,error}=await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){
alert(error.message);
return;
}

currentUser=data.user;
await loadAccount();
alert("Login सफल!");
}

async function logout(){
const {error}=await db.auth.signOut();

if(error){
alert(error.message);
return;
}

currentUser=null;
currentRole=null;
show("home");
alert("Logout हो गया");
}

async function loadAccount(){
const {data,error}=await db.auth.getUser();

if(error || !data.user){
currentUser=null;
return;
}

currentUser=data.user;

const {data:profile,error:profileError}=await db
.from("profiles")
.select("full_name,role")
.eq("id",currentUser.id)
.maybeSingle();

if(profileError){
alert("Profile Error: "+profileError.message);
return;
}

if(!profile){
alert("Profile नहीं मिली। Supabase SQL Setup चेक करें।");
return;
}

currentRole=profile.role;

document.getElementById("userInfo").innerText=
"Name: "+profile.full_name+
" | Email: "+currentUser.email+
" | Role: "+profile.role;

show("account");

if(profile.role==="recruiter"){
show("recruiter");
loadMyJobs();
}
}

async function loadJobs(){
const box=document.getElementById("jobs");

const {data,error}=await db
.from("jobs")
.select("*")
.eq("status","approved")
.order("created_at",{ascending:false});

if(error){
box.innerText="Jobs लोड नहीं हुईं: "+error.message;
return;
}

allJobs=data||[];
renderJobs(allJobs);
}

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function renderJobs(list){
const box=document.getElementById("jobs");

if(!list.length){
box.innerHTML="<p>अभी कोई Job उपलब्ध नहीं है।</p>";
return;
}

box.innerHTML=list.map(j=>`
<div class="card">
<h3 class="job-title">${safe(j.title)}</h3>
<b>${safe(j.company)}</b>
<p>📍 ${safe(j.location)}</p>
<p>💰 ${safe(j.salary||"जानकारी उपलब्ध नहीं")}</p>
<p>${safe(j.description)}</p>
<button onclick="applyJob('${safe(j.id)}')">Free Apply</button>
<a href="https://wa.me/918168655138?text=${encodeURIComponent("Hello, I want to apply for "+j.title+" at "+j.company)}" target="_blank" rel="noopener">
<button class="whatsapp">WhatsApp Apply</button>
</a>
</div>
`).join("");
}

function filterJobs(){
const q=document.getElementById("search").value.toLowerCase();

renderJobs(allJobs.filter(j=>
[j.title,j.company,j.location,j.description]
.join(" ").toLowerCase().includes(q)
));
}

async function applyJob(jobId){
if(!currentUser){
alert("Apply करने के लिए पहले Login करें");
show("login");
return;
}

if(currentRole!=="candidate"){
alert("Apply केवल Candidate Account से कर सकते हैं");
return;
}

const {error}=await db.from("applications").insert({
job_id:jobId,
candidate_id:currentUser.id
});

if(error){
alert("Apply नहीं हुआ: "+error.message);
return;
}

alert("Application सफलतापूर्वक भेज दी गई!");
}

async function postJob(){
if(!currentUser || currentRole!=="recruiter"){
alert("Recruiter Login जरूरी है");
return;
}

const title=document.getElementById("jobTitle").value.trim();
const company=document.getElementById("company").value.trim();
const location=document.getElementById("location").value.trim();
const salary=document.getElementById("salary").value.trim();
const description=document.getElementById("description").value.trim();

if(!title || !company || !location){
alert("Job Title, Company और Location भरें");
return;
}

const {error}=await db.from("jobs").insert({
recruiter_id:currentUser.id,
title:title,
company:company,
location:location,
salary:salary,
description:description,
status:"pending"
});

if(error){
alert("Job Submit नहीं हुई: "+error.message);
return;
}

alert("Job Submit हो गई! Approval के बाद Home पर दिखाई देगी।");

document.getElementById("jobTitle").value="";
document.getElementById("company").value="";
document.getElementById("location").value="";
document.getElementById("salary").value="";
document.getElementById("description").value="";

loadMyJobs();
}

async function loadMyJobs(){
if(!currentUser)return;

const {data,error}=await db.from("jobs")
.select("*")
.eq("recruiter_id",currentUser.id)
.order("created_at",{ascending:false});

const box=document.getElementById("myJobs");

if(error){
box.innerText=error.message;
return;
}

if(!data || !data.length){
box.innerHTML="<p>अभी आपने कोई Job पोस्ट नहीं की।</p>";
return;
}

box.innerHTML=data.map(j=>`
<div class="card">
<h3>${safe(j.title)}</h3>
<p>${safe(j.company)} - ${safe(j.location)}</p>
<p class="status">Status: ${safe(j.status)}</p>
</div>
`).join("");
}

db.auth.onAuthStateChange((event,session)=>{
currentUser=session?.user||null;
});

(async()=>{
const {data,error}=await db.auth.getSession();

if(error){
alert(error.message);
return;
}

if(data.session){
await loadAccount();
}

await loadJobs();
})();
</script>

</body>
</html>
