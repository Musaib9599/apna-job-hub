<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apna Job Hub</title>
<style>
:root{--blue:#155eef;--dark:#101828;--muted:#667085;--bg:#f5f7fb;--line:#e4e7ec}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--dark)}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:21px;font-weight:800;color:var(--blue)}button,.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--blue);color:white;font-weight:700;cursor:pointer}
button.secondary{background:#eef4ff;color:var(--blue)}button.danger{background:#b42318}
main{max-width:1100px;margin:24px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#123eaa,#2878ef);color:white;padding:30px;border-radius:18px}
.hero h1{font-size:30px;margin:0 0 8px}.hero p{margin:0 0 18px;color:#e7efff}
.search{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;background:white;padding:9px;border-radius:12px}
input,select,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;font:inherit;background:#fff;color:#101828}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:18px}
.card{background:white;border:1px solid var(--line);border-radius:13px;padding:16px}
.card h3{margin:0 0 8px}.muted{color:var(--muted);font-size:14px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{display:inline-block;background:#eff8ff;color:#175cd3;padding:5px 8px;border-radius:20px;font-size:12px;margin:3px 3px 3px 0}
section{margin-top:24px}h2{font-size:21px}.hidden{display:none!important}.form{display:grid;gap:10px;max-width:520px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.notice{padding:12px;border-radius:9px;background:#fffaeb;color:#93370d;margin:12px 0}
.success{background:#ecfdf3;color:#027a48}.error{background:#fef3f2;color:#b42318}
footer{text-align:center;color:var(--muted);padding:30px 12px;font-size:13px}
@media(max-width:650px){.grid{grid-template-columns:1fr}.search{grid-template-columns:1fr}.hero h1{font-size:24px}.nav{align-items:flex-start}.nav .row{justify-content:flex-end}}
</style>
</head>
<body>
<header><div class="nav"><div class="brand">Apna Job Hub</div><div class="row" id="navActions"><button class="secondary" onclick="showAuth('login')">Login</button><button onclick="showAuth('signup')">Register</button></div></div></header>
<main>
<div class="hero">
<h1>Apni pasand ki naukri khojein</h1><p>Poore India mein jobs search karein. Location khaali chhodein to All India jobs dikhenगी.</p>
<div class="search"><input id="searchText" placeholder="Job title ya company (jaise Warehouse)"><input id="searchCity" list="indiaLocations" placeholder="City ya State (khali = All India)">
<datalist id="indiaLocations">
<option value="Delhi"><option value="Mumbai, Maharashtra"><option value="Pune, Maharashtra"><option value="Bengaluru, Karnataka"><option value="Hyderabad, Telangana"><option value="Chennai, Tamil Nadu"><option value="Kolkata, West Bengal"><option value="Faridabad, Haryana"><option value="Gurugram, Haryana"><option value="Noida, Uttar Pradesh"><option value="Ghaziabad, Uttar Pradesh"><option value="Jaipur, Rajasthan"><option value="Ahmedabad, Gujarat"><option value="Surat, Gujarat"><option value="Lucknow, Uttar Pradesh"><option value="Kanpur, Uttar Pradesh"><option value="Bhopal, Madhya Pradesh"><option value="Indore, Madhya Pradesh"><option value="Patna, Bihar"><option value="Ranchi, Jharkhand"><option value="Raipur, Chhattisgarh"><option value="Bhubaneswar, Odisha"><option value="Guwahati, Assam"><option value="Chandigarh"><option value="Amritsar, Punjab"><option value="Ludhiana, Punjab"><option value="Dehradun, Uttarakhand"><option value="Shimla, Himachal Pradesh"><option value="Jammu, Jammu and Kashmir"><option value="Srinagar, Jammu and Kashmir"><option value="Panaji, Goa"><option value="Thiruvananthapuram, Kerala"><option value="Kochi, Kerala"><option value="Coimbatore, Tamil Nadu"><option value="Visakhapatnam, Andhra Pradesh"><option value="Vijayawada, Andhra Pradesh"><option value="Mysuru, Karnataka"><option value="Nagpur, Maharashtra"><option value="Nashik, Maharashtra"><option value="Aurangabad, Maharashtra"><option value="Agartala, Tripura"><option value="Imphal, Manipur"><option value="Shillong, Meghalaya"><option value="Aizawl, Mizoram"><option value="Kohima, Nagaland"><option value="Itanagar, Arunachal Pradesh"><option value="Gangtok, Sikkim"><option value="Port Blair, Andaman and Nicobar Islands"><option value="Silvassa, Dadra and Nagar Haveli and Daman and Diu"><option value="Puducherry">
</datalist><button onclick="loadJobs()">Search Jobs</button></div>
</div>
<div id="message"></div>
<section id="authPanel" class="card hidden">
<div class="row" style="justify-content:space-between"><h2 id="authTitle">Login</h2><button class="secondary" onclick="hideAuth()">Close</button></div>
<form class="form" id="authForm">
<div id="nameWrap" class="hidden"><label>Naam</label><input id="fullName" autocomplete="name"></div>
<div id="phoneWrap" class="hidden"><label>Mobile number</label><input id="phone" inputmode="tel" placeholder="10 digit mobile"></div>
<label>Email</label><input id="email" type="email" required autocomplete="email">
<label>Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password">
<div id="roleWrap" class="hidden"><label>Account type</label><select id="userType"><option value="candidate">Candidate (Job dhoondhne wala)</option><option value="recruiter">Recruiter (Job dene wala)</option></select></div>
<button id="authSubmit" type="submit">Login</button>
</form></section>
<section id="dashboard" class="hidden">
<div class="row" style="justify-content:space-between"><h2 id="welcome">Dashboard</h2><button class="secondary" onclick="logout()">Logout</button></div>
<div class="tabs" id="tabs"></div><div id="dashContent"></div></section>
<section><div class="row" style="justify-content:space-between"><h2>Latest Jobs</h2><span class="muted" id="jobCount"></span></div><div id="jobs" class="grid"><div class="card">Jobs load ho rahi hain...</div></div></section>
</main>
<footer>Apna Job Hub · Independent job portal · Job details verify karke hi apply karein.</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://obfscofwdnypjabtgpyy.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_NTjzI2NEwJZjPaZDuuU_fQ_TWWtxxm-";
const configured = SUPABASE_URL.startsWith("https://") && !SUPABASE_URL.includes("PASTE_") && !SUPABASE_ANON_KEY.includes("PASTE_");
const db = configured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
let currentUser=null, currentProfile=null, authMode="login", activeTab="profile";

function msg(text,type="notice"){const el=document.getElementById("message");el.className=type;el.textContent=text;el.classList.remove("hidden");}
function clearMsg(){const el=document.getElementById("message");el.textContent="";el.className="";}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function showAuth(mode){authMode=mode;document.getElementById("authPanel").classList.remove("hidden");document.getElementById("authTitle").textContent=mode==="login"?"Login":"Naya Account Banayein";document.getElementById("authSubmit").textContent=mode==="login"?"Login":"Register";["nameWrap","phoneWrap","roleWrap"].forEach(id=>document.getElementById(id).classList.toggle("hidden",mode==="login"));document.getElementById("password").autocomplete=mode==="login"?"current-password":"new-password";}
function hideAuth(){document.getElementById("authPanel").classList.add("hidden");}
function requireConfig(){if(!db){msg("Pehle index.html mein Supabase URL aur Publishable/anon key add karein, phir page reload karein.","error");return false;}return true;}
document.getElementById("authForm").addEventListener("submit",async e=>{
 e.preventDefault();if(!requireConfig())return;clearMsg();
 const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
 try{
  if(authMode==="signup"){
   const full_name=document.getElementById("fullName").value.trim(),phone=document.getElementById("phone").value.trim(),role=document.getElementById("userType").value;
   const {data,error}=await db.auth.signUp({email,password,options:{data:{full_name,phone,role}}});if(error)throw error;
   msg(data.session?"Account ban gaya.":"Account request ho gayi. Email confirmation on hai to inbox verify karein.","success");hideAuth();await checkSession();
  }else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;hideAuth();await checkSession();}
 }catch(err){msg(err.message||"Authentication error","error");}
});
async function checkSession(){if(!db)return;const {data:{session}}=await db.auth.getSession();currentUser=session?.user||null;if(currentUser){await loadProfile();}else{currentProfile=null;document.getElementById("dashboard").classList.add("hidden");document.getElementById("navActions").innerHTML='<button class="secondary" onclick="showAuth(\'login\')">Login</button><button onclick="showAuth(\'signup\')">Register</button>';}}
async function loadProfile(){const {data,error}=await db.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();if(error){msg(error.message,"error");return;}currentProfile=data;renderDashboard();}
async function logout(){await db.auth.signOut();currentUser=null;currentProfile=null;await checkSession();msg("Logout ho gaya.","success");}
function renderDashboard(){document.getElementById("dashboard").classList.remove("hidden");document.getElementById("welcome").textContent="Namaste, "+(currentProfile?.full_name||currentUser.email);document.getElementById("navActions").innerHTML='<span class="muted">'+esc(currentProfile?.role||"User")+'</span>';let tabs=currentProfile?.role==="admin"?["profile","post","candidates","myjobs","applications","admin"]:currentProfile?.role==="recruiter"?["profile","post","candidates","myjobs","applications"]:["profile","applications"];document.getElementById("tabs").innerHTML=tabs.map(t=>`<button class="${activeTab===t?"":"secondary"}" onclick="openTab('${t}')">${({profile:"Profile",post:"Post Job",candidates:"Find Candidates",myjobs:"My Jobs",applications:"Applications",admin:"Admin Approval"})[t]}</button>`).join("");openTab(tabs.includes(activeTab)?activeTab:tabs[0]);}
async function openTab(tab){activeTab=tab;renderTabsOnly();const box=document.getElementById("dashContent");box.innerHTML="Loading...";
if(tab==="profile"){box.innerHTML=`<div class="card"><h3>Profile</h3><form class="form" id="profileForm"><label>Full name</label><input id="pname" value="${esc(currentProfile?.full_name||"")}"><label>Mobile</label><input id="pphone" value="${esc(currentProfile?.phone||"")}"><label>City</label><input id="pcity" value="${esc(currentProfile?.city||"")}"><label>Skills / Experience</label><textarea id="pskills" rows="3">${esc(currentProfile?.skills||"")}</textarea>${currentProfile?.role==="candidate"?`<label style="display:flex;gap:8px;align-items:center"><input id="pvisible" type="checkbox" style="width:auto" ${currentProfile?.candidate_visible?"checked":""}> Recruiters ko meri profile aur contact details dikhane ki permission hai</label>`:""}<button>Save Profile</button></form></div>`;document.getElementById("profileForm").onsubmit=saveProfile;}
if(tab==="post"){box.innerHTML=`<div class="card"><h3>Nayi Job Post Karein</h3><form class="form" id="jobForm"><label>Job title</label><input id="jtitle" required value="Picker / Packer" placeholder="Warehouse Picker / Delivery Boy"><small class="muted">Default role: Picker / Packer (aap badal bhi sakte hain)</small><label>Company name</label><input id="jcompany" required value="Blinkit"><small class="muted">Default company: Blinkit (aap badal bhi sakte hain)</small><label>Job Location (City / State)</label><input id="jcity" list="indiaLocations" required placeholder="City, State (jaise Faridabad, Haryana)"><label>Salary (monthly)</label><input id="jsalary" placeholder="12000-16000"><label>Job type</label><select id="jtype"><option>Full Time</option><option>Part Time</option><option>Contract</option></select><label>Recruiter WhatsApp / mobile</label><input id="jcontact" placeholder="10 digit mobile" value="${esc(currentProfile?.phone||"")}"><label>Vacancies</label><input id="jvacancies" type="number" min="1" value="1"><label>Job description</label><textarea id="jdesc" rows="4" required>Picker / Packer warehouse job at Blinkit. Duties: picking, packing, scanning and sorting orders.</textarea><button>Post Job Now</button></form></div>`;document.getElementById("jobForm").onsubmit=createJob;}
if(tab==="candidates")await showCandidates(box);
if(tab==="myjobs")await showMyJobs(box);
if(tab==="applications")await showApplications(box);
if(tab==="admin")await showAdmin(box);
}
function renderTabsOnly(){document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("secondary",b.textContent.toLowerCase()!==({profile:"profile",post:"post job",candidates:"find candidates",myjobs:"my jobs",applications:"applications",admin:"admin approval"}[activeTab])));}
async function saveProfile(e){e.preventDefault();const patch={full_name:document.getElementById("pname").value.trim(),phone:document.getElementById("pphone").value.trim(),city:document.getElementById("pcity").value.trim(),skills:document.getElementById("pskills").value.trim()};if(currentProfile?.role==="candidate")patch.candidate_visible=!!document.getElementById("pvisible")?.checked;const {error}=await db.from("profiles").update(patch).eq("id",currentUser.id);if(error)msg(error.message,"error");else{await loadProfile();msg("Profile save ho gayi.","success");}}
async function createJob(e){
 e.preventDefault();
 const companyName=document.getElementById("jcompany").value.trim()||"Blinkit";
 const jobLocation=document.getElementById("jcity").value.trim();
 const job={recruiter_id:currentUser.id,title:document.getElementById("jtitle").value.trim()||"Picker / Packer",company:companyName,company_name:companyName,city:jobLocation,location:jobLocation,salary:document.getElementById("jsalary").value.trim(),contact_phone:document.getElementById("jcontact").value.trim(),job_type:document.getElementById("jtype").value,vacancies:Number(document.getElementById("jvacancies").value),description:document.getElementById("jdesc").value.trim(),status:"approved"};
 const {error}=await db.from("jobs").insert(job);if(error){msg(error.message,"error");}else{msg("Job post ho gayi! Ab India bhar mein search mein dikh sakti hai.","success");e.target.reset();await loadJobs();}
}
async function loadJobs(){
 if(!requireConfig())return;const term=document.getElementById("searchText").value.trim(),location=document.getElementById("searchCity").value.trim();
 let q=db.from("jobs").select("*").eq("status","approved").order("created_at",{ascending:false}).limit(100);
 if(term)q=q.or(`title.ilike.%${term}%,company.ilike.%${term}%,company_name.ilike.%${term}%,description.ilike.%${term}%`);
 if(location)q=q.ilike("city",`%${location}%`);
 const {data,error}=await q;if(error){document.getElementById("jobs").innerHTML='<div class="card">Jobs load nahi hui: '+esc(error.message)+'</div>';return;}renderJobs(data||[]);
}
function renderJobs(jobs){document.getElementById("jobCount").textContent=jobs.length+" jobs";const el=document.getElementById("jobs");if(!jobs.length){el.innerHTML='<div class="card">Abhi koi approved job available nahi hai.</div>';return;}el.innerHTML=jobs.map(j=>`<article class="card"><h3>${esc(j.title)}</h3><div><b>${esc(j.company||j.company_name||"")}</b></div><p class="muted">📍 ${esc(j.city||j.location||"")} · ${esc(j.job_type||"Full Time")}</p><div class="tag">₹ ${esc(j.salary||"Salary not listed")}</div><div class="tag">${esc(j.vacancies||1)} vacancy</div><p>${esc(j.description||"")}</p><div class="row"><button onclick="applyJob('${j.id}')">Apply Now</button>${j.contact_phone?`<a class="btn" style="text-decoration:none;background:#128c7e" target="_blank" rel="noopener" href="https://wa.me/91${encodeURIComponent(j.contact_phone.replace(/\D/g,''))}?text=${encodeURIComponent('Namaste, mujhe '+j.title+' job ke liye apply karna hai.')}">WhatsApp</a>`:""}</div></article>`).join("");}
async function applyJob(id){
 if(!currentUser){showAuth("login");msg("Apply karne ke liye pehle login karein.");return;}
 if(currentProfile?.role!=="candidate"){msg("Job apply karne ke liye Candidate account chahiye.","error");return;}
 const candidateName=(currentProfile?.full_name||currentUser.user_metadata?.full_name||"").trim();
 const candidatePhone=(currentProfile?.phone||currentUser.user_metadata?.phone||"").trim();
 const candidateEmail=(currentUser.email||"").trim();
 const candidateExperience=(currentProfile?.skills||"Not specified").trim()||"Not specified";
 if(!candidateName){msg("Apply karne se pehle Profile mein apna Full name bharein aur Save Profile dabayein.","error");openTab("profile");return;}
 const application={job_id:id,candidate_id:currentUser.id,candidate_name:candidateName,experience:candidateExperience,phone:candidatePhone,email:candidateEmail,status:"applied"};
 const {error}=await db.from("applications").insert(application);
 if(error){msg(error.code==="23505"?"Aap pehle hi apply kar chuke hain.":error.message,"error");}
 else msg("Application submit ho gayi! Recruiter aapka profile dekh sakta hai.","success");
}
async function showCandidates(box){
 if(currentProfile?.role!=="recruiter"&&currentProfile?.role!=="admin"){box.textContent="Recruiter access required.";return;}
 box.innerHTML=`<div class="card"><h3>Candidate Search</h3><p class="muted">Sirf wahi candidates dikhte hain jinhone apni profile recruiters ke saath share karne ki permission di hai.</p><div class="form"><input id="candidateSearch" placeholder="Naam, skill, experience ya city search karein"><button type="button" onclick="filterCandidates()">Search Candidates</button></div><div id="candidateResults" class="grid" style="margin-top:14px">Candidates load ho rahe hain...</div></div>`;await filterCandidates();
}
async function filterCandidates(){
 const out=document.getElementById("candidateResults");if(!out)return;out.innerHTML='<div class="card">Candidates load ho rahe hain...</div>';
 const term=(document.getElementById("candidateSearch")?.value||"").trim();let q=db.from("profiles").select("id,full_name,phone,city,skills").eq("role","candidate").eq("candidate_visible",true).order("full_name").limit(100);
 if(term)q=q.or(`full_name.ilike.%${term}%,city.ilike.%${term}%,skills.ilike.%${term}%`);
 const {data,error}=await q;if(error){out.innerHTML='<div class="card error">Candidate list load nahi hui: '+esc(error.message)+'</div>';return;}
 if(!data?.length){out.innerHTML='<div class="card">Abhi koi candidate available nahi hai. Candidates ko Profile mein sharing permission ON karni hogi.</div>';return;}
 out.innerHTML=data.map(c=>`<article class="card"><h3>${esc(c.full_name||"Candidate")}</h3><p class="muted">📍 ${esc(c.city||"Location not added")}</p><p>${esc(c.skills||"Skills / experience not added")}</p><div class="row">${c.phone?`<a class="btn" style="text-decoration:none;background:#128c7e" target="_blank" rel="noopener" href="https://wa.me/91${encodeURIComponent(String(c.phone).replace(/\D/g,''))}">WhatsApp Contact</a><a class="btn" style="text-decoration:none" href="tel:${encodeURIComponent(c.phone)}">Call</a>`:'<span class="muted">Contact number nahi diya</span>'}</div></article>`).join("");
}
async function showMyJobs(box){const {data,error}=await db.from("jobs").select("*").eq("recruiter_id",currentUser.id).order("created_at",{ascending:false});if(error){box.textContent=error.message;return;}box.innerHTML='<div class="grid">'+(data||[]).map(j=>`<div class="card"><h3>${esc(j.title)}</h3><p>${esc(j.company||j.company_name||"")} · ${esc(j.city||j.location||"")}</p><span class="tag">${esc(j.status)}</span><p class="muted">Salary: ${esc(j.salary||"-")}</p></div>`).join("")+'</div>';}
async function showApplications(box){
 let q;if(currentProfile?.role==="recruiter")q=db.from("applications").select("id,status,created_at,candidate_name,experience,phone,email,jobs!inner(title,company,recruiter_id)").eq("jobs.recruiter_id",currentUser.id);
 else q=db.from("applications").select("id,status,created_at,candidate_name,experience,phone,email,jobs(title,company,city)").eq("candidate_id",currentUser.id);
 const {data,error}=await q.order("created_at",{ascending:false});if(error){box.textContent=error.message;return;}
 box.innerHTML=(data||[]).length?(data||[]).map(a=>`<div class="card" style="margin:10px 0"><b>${esc(a.jobs?.title||"Job")}</b><p class="muted">${esc(a.jobs?.company||"")} · ${esc(a.status)}</p><p>${esc(a.candidate_name||"")} ${esc(a.experience||"")}</p><p>${esc(a.phone||"")} ${esc(a.email||"")}</p></div>`).join(""):'<div class="card">Abhi koi application nahi hai.</div>';
}
async function showAdmin(box){if(currentProfile?.role!=="admin"){box.textContent="Admin access required.";return;}const {data,error}=await db.from("jobs").select("*").eq("status","pending").order("created_at");if(error){box.textContent=error.message;return;}box.innerHTML=(data||[]).length?(data||[]).map(j=>`<div class="card" style="margin:10px 0"><h3>${esc(j.title)}</h3><p>${esc(j.company||j.company_name||"")} · ${esc(j.city||j.location||"")} · ₹${esc(j.salary||"-")}</p><p>${esc(j.description)}</p><div class="row"><button onclick="moderateJob('${j.id}','approved')">Approve</button><button class="danger" onclick="moderateJob('${j.id}','rejected')">Reject</button></div></div>`).join(""):'<div class="card">Pending jobs nahi hain.</div>';}
async function moderateJob(id,status){const {error}=await db.from("jobs").update({status}).eq("id",id);if(error)msg(error.message,"error");else{msg("Job "+status+" ho gayi.","success");openTab("admin");}}
(async()=>{if(!configured)msg("Setup: index.html mein Supabase URL aur Publishable/anon key paste karein. SQL setup.sql ko Supabase SQL Editor mein run karein.");else{await checkSession();await loadJobs();db.auth.onAuthStateChange(()=>setTimeout(checkSession,0));}})();
</script>
</body>
</html>
